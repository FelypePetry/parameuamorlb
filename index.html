<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz Aniversário, Meu Amor ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #2d132c, #100720);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: #fff;
      padding: 24px 16px;
      position: relative;
    }

    /* Partículas de coração de fundo */
    .heart-particle {
      position: fixed;
      bottom: -30px;
      color: rgba(235, 110, 140, 0.45);
      font-size: 18px;
      pointer-events: none;
      animation: floatUp 7s linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-110vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }

    /* Tela de Toque Inicial */
    #start-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #2d132c, #100720);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      z-index: 20;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      padding: 20px;
    }

    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .start-btn {
      background: linear-gradient(135deg, #e84393, #d63031);
      color: white;
      border: none;
      padding: 14px 34px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(232, 67, 147, 0.4);
      transition: transform 0.2s ease;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    /* Cartão Principal */
    .container {
      position: relative;
      z-index: 5;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 20px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
      margin: auto;
    }

    .tag-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      margin-bottom: 20px;
      color: #ff99bb;
      letter-spacing: 0.5px;
    }

    /* Contador de Tempo */
    .counter-wrapper {
      margin-bottom: 24px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 16px 12px;
    }

    .counter-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #dfdfe6;
      margin-bottom: 12px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .time-unit {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 4px;
    }

    .time-unit span {
      display: block;
      font-weight: 600;
      font-size: 1.25rem;
      color: #fff;
    }

    .time-unit small {
      font-size: 0.65rem;
      color: #ffb3c6;
      text-transform: uppercase;
    }

    /* Caixa da Mensagem Typewriter */
    .message-box {
      font-size: 0.95rem;
      line-height: 1.8;
      text-align: left;
      color: #eaeaea;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      padding: 20px 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background-color: #ff85a1;
      vertical-align: text-bottom;
      animation: blink 0.9s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .signature {
      margin-top: 18px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      text-align: right;
      color: #ff99bb;
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
  </style>
</head>

    // Lógica do Contador
    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;

      if (diff < 0) return;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateCounter, 1000);
    updateCounter();

    const textTarget = document.getElementById('typewriter-text');
    const signature = document.getElementById('signature');

        else if (currentChar === ',') delay = 180;
        else if (currentChar === '\n') delay = 420;

        setTimeout(typeWriter, delay);
      } else {
        document.getElementById('cursor').style.display = 'none';
        signature.style.opacity = '1';
      }
    }

    const startScreen = document.getElementById('start-screen');

      setTimeout(typeWriter, 500);
    });
